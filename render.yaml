# Render Blueprint: one web service (API + React frontend in one image) and Postgres.
# Deploy: Render Dashboard → New → Blueprint → pick this repo → Apply.
services:
  - name: tala
    type: web
    runtime: docker
    dockerfilePath: ./compose/production/Dockerfile
    dockerContext: .
    # Whisper `base` uses ~500 MB while transcribing; the 512 MB plans are too tight.
    plan: 1c-2g
    region: singapore
    healthCheckPath: /api/health
    # The job queue lives in-process: keep this at exactly one instance.
    numInstances: 1
    # Uploads wait here until transcribed. A disk keeps them across deploys/restarts, and
    # makes Render stop the old instance before starting the new one (no overlapping workers).
    disk:
      name: tala-data
      mountPath: /data
      sizeGB: 1
    # The Whisper model is baked into the image (and the Hub is offline at runtime), so change
    # the model with `ARG WHISPER_MODEL` in compose/production/Dockerfile, not an env var here.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tala-db
          property: connectionString
      - key: WHISPER_BATCH_SIZE
        value: "8"
      - key: WHISPER_BEAM_SIZE
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: RETENTION_HOURS
        value: "72"
      - key: APP_URL
        value: https://tala.vicentereyes.org
      - key: EMAIL_FROM
        value: Tala <noreply@rs.vicentereyes.org>
      # Secret: set it in the Render dashboard (Environment tab), never in this file.
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: tala-db
    databaseName: tala
    user: tala
    plan: free
    region: singapore
